name: E2E Cypress Tests with Allure Reporting

on:
  # Trigger the workflow on push or pull request events for the main branch
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

jobs:
  cypress-run:
    name: Cypress Test Execution
    runs-on: ubuntu-latest

    steps:
      # Step 1: Clone the repository to the runner machine
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Initialize Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # Step 3: Install project dependencies defined in package.json
      - name: Install Dependencies
        run: npm install

      # Step 4: Execute Cypress tests with Allure environment enabled
      # 'continue-on-error' is set to true to ensure reporting step runs even if tests fail
      - name: Run Cypress Tests
        run: npm run test:allure
        continue-on-error: true

      # Step 5: Convert raw test results into a visual HTML report
      - name: Generate Allure Report
        run: npm run allure:report

      # Step 6: Store the generated report as a downloadable artifact
      - name: Upload Allure Report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report

      # Step 7: Capture screenshots for failed test cases
      - name: Upload Screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots

      # Step 8: Capture video recordings for failed test cases
      - name: Upload Videos
        if: failure() 
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: cypress/videos